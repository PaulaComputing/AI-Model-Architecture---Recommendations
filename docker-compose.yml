services:
  redis:
    image: redis:7-alpine
    container_name: ep3-redis
    restart: always

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ep3-rabbitmq
    restart: always

  api:
    build: ./api
    container_name: ep3-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - API_KEY=duoc-ep3-secret-key-2026
    depends_on:
      - redis
      - rabbitmq
    restart: always

  worker:
    build: ./api
    container_name: ep3-worker
    command: python worker.py
    environment:
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - redis
      - rabbitmq
    restart: always

  dashboard:
    build: ./dashboard
    container_name: ep3-dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - API_KEY=duoc-ep3-secret-key-2026
    depends_on:
      - api
    restart: always